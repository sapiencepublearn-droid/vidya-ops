# Render reads this and configures the service.
# Database is Neon (free tier), so only the web service is defined here.
services:
  - type: web
    name: sapience-team
    runtime: node
    plan: free             # sleeps after 15 min idle; see README on keeping it awake
    region: singapore      # closest Render region to Chennai
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and Vite (the frontend build tool) is one of them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pinned: the app is tested on 22. Render otherwise picks the latest
      # major, which is how an untested runtime reaches production.
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true          # Render generates and stores it
      - key: FILE_SECRET
        generateValue: true
      # Free plans have no persistent disk, so uploads go in the database.
      # Switch to 'disk' (with a disk attached) or 's3' on a paid plan.
      - key: STORAGE_DRIVER
        value: db
      # Free plans have no pre-deploy hook, so migrations run at startup.
      - key: RUN_MIGRATIONS_ON_BOOT
        value: "true"
      - key: DATABASE_URL
        sync: false                  # paste your Neon connection string
      - key: ADMIN_DATABASE_URL
        sync: false                  # same string; used by migrations
      - key: CORS_ORIGINS
        sync: false                  # your final https URL, no trailing slash
